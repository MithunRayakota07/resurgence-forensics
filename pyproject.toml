[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resurgence-forensics"
version = "0.1.0"
description = "Fragment-reassembly file carving and SP 800-88r2 secure erasure for raw disk images"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mithun Rayakota"}]
keywords = ["forensics", "file-carving", "data-recovery", "secure-erase", "nist-sp-800-88"]

# Core carving needs only these two. The web API, the benchmark harness and
# the learned-adjacency experiment are all optional extras, so a plain
# `pip install resurgence-forensics` does not drag in a web server or torch.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    # Ed25519 signing for the sanitization certificate chain. NOT optional:
    # erase/certificate.py falls back to writing UNSIGNED records when this is
    # missing, which would make "signed certificate" a false claim.
    "pynacl>=1.5",
]

[project.optional-dependencies]
# The FastAPI backend that streams the beam-search trace to the web UI.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# Test suite.
dev = [
    "pytest>=8.0",
]

[project.scripts]
resurgence-carve = "carve.carver:main"
resurgence-erase-drive = "erase.drive:main"
resurgence-erase-metadata = "erase.metadata:main"
resurgence-erase-residue = "erase.wipe_residue:main"
resurgence-gen-corpus = "corpus.generate.synthetic:main"
resurgence-gen-real = "corpus.generate.real_photos:main"
resurgence-success-rate = "bench.success_rate:main"
resurgence-bench = "bench.report:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ imports conftest helpers directly, and the packages under test are
# installed, so the rootdir is all that needs to be importable.
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: end-to-end carves over real disk images (tens of seconds each)",
]

[tool.setuptools]
# Listed explicitly rather than auto-discovered: the repo root also holds
# corpus data directories and web/, which are not Python packages.
packages = [
    "carve",
    "carve.priors",
    "carve.validators",
    "erase",
    "model",
    "bench",
    "corpus",
    "corpus.generate",
    "api",
]
